[project]
name = "realtime-event-processing"
version = "0.1.0"
description = "Real-time event pipeline with explicit failure behaviour: versioned events in, per-window aggregates out."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_pipeline"]

# Allowlist: hatchling ignores .git/info/exclude, so anything not listed here stays out of the sdist.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# strict: unknown config keys, unregistered markers, passing xfails and duplicate parametrize ids
# are errors.
strict = true
addopts = "-ra"
markers = [
    "integration: needs real PostgreSQL/Kafka; run with `make test-integration`",
]
# A deprecation fails the run instead of scrolling past; the lock pins versions, so this only
# trips on a deliberate upgrade.
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
]
